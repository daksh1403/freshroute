name: FreshRoute validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m freshroute benchmark --output reports/benchmark
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test_wasm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark
          path: reports/benchmark
